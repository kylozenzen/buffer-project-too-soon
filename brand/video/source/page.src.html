<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Too Soon? — 20s reel</title>
<style>
/*FONTS*/
html, body { margin: 0; background: #111; }
canvas { display: block; width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh; margin: auto; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
(function () {
  'use strict';
  const W = 1920, H = 1080, STORY = 20;
  // Half-second holds at each scene's resting point (story time), so every screen breathes.
  const HOLDS = [3.5, 6.3, 10.4, 14.4, 17.3, 19.6], HOLD = 0.5;
  const DUR = STORY + HOLDS.length * HOLD;
  function storyTime(T) {
    let t = T;
    for (const h of HOLDS) {
      if (t <= h) break;
      if (t < h + HOLD) return h;
      t -= HOLD;
    }
    return Math.min(t, STORY);
  }
  const cv = document.getElementById('c');
  const g = cv.getContext('2d');

  // ---------- palette (Too Soon? brand) ----------
  const C = {
    paper: '#f6f1e7', paper2: '#efe7d8', card: '#fffdf8', white: '#ffffff',
    ink: '#161412', ink2: '#4a443d', ink3: '#8a8277', line: '#ded4c2',
    red: '#e5432b', redSoft: '#fde4de', amber: '#e9a400', amberText: '#9a6c00', amberSoft: '#fdf0cc',
    green: '#2e8f62', greenSoft: '#dcf1e5', blue: '#2b59c3', blueSoft: '#e0e8fb',
  };
  const F = { disp: 'Bricolage Grotesque', body: 'Inter', mono: 'JetBrains Mono' };

  // ---------- math + easing ----------
  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const prog = (t, a, b) => clamp((t - a) / (b - a));
  const lerp = (a, b, x) => a + (b - a) * x;
  const outExpo = x => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
  const inExpo = x => (x <= 0 ? 0 : Math.pow(2, 10 * x - 10));
  const inOutExpo = x => (x <= 0 ? 0 : x >= 1 ? 1 : x < 0.5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2);
  const outCubic = x => 1 - Math.pow(1 - x, 3);
  const outBack = x => { const c1 = 1.7, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
  const spring = x => (x <= 0 ? 0 : x >= 1.6 ? 1 : 1 - Math.exp(-6 * x) * Math.cos(12 * x));
  const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

  // ---------- drawing helpers ----------
  function rr(x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  }
  function box(x, y, w, h, r, fill, stroke, lw = 4, shadow) {
    if (shadow) { g.fillStyle = shadow.color; rr(x + shadow.dx, y + shadow.dy, w, h, r); g.fill(); }
    rr(x, y, w, h, r);
    if (fill) { g.fillStyle = fill; g.fill(); }
    if (stroke) { g.lineWidth = lw; g.strokeStyle = stroke; g.stroke(); }
  }
  function font(size, weight = 700, fam = F.body) { g.font = `${weight} ${size}px "${fam}"`; }
  function txt(s, x, y, size, color, weight = 700, fam = F.body, align = 'left', base = 'alphabetic', track = 0) {
    font(size, weight, fam); g.fillStyle = color; g.textAlign = align; g.textBaseline = base;
    if (track) { g.letterSpacing = `${track}px`; }
    g.fillText(s, x, y);
    if (track) { g.letterSpacing = '0px'; }
  }
  function mono(s, x, y, size, color, align = 'left') { txt(s.toUpperCase(), x, y, size, color, 700, F.mono, align, 'alphabetic', size * 0.12); }
  function width(s, size, weight = 700, fam = F.body, track = 0) { font(size, weight, fam); g.letterSpacing = `${track}px`; const w = g.measureText(s).width; g.letterSpacing = '0px'; return w; }
  const monoWidth = (s, size) => width(s.toUpperCase(), size, 700, F.mono, size * 0.12);
  function withAlpha(a, fn) { if (a <= 0) return; g.save(); g.globalAlpha *= clamp(a); fn(); g.restore(); }
  function at(x, y, s, rot, fn) { g.save(); g.translate(x, y); if (rot) g.rotate(rot); if (s !== 1) g.scale(s, s); fn(); g.restore(); }

  // Typing reveal with a block cursor. Segments let parts of the line be coloured (hashtags).
  function typeLine(segs, x, y, size, t, t0, t1, opts = {}) {
    const full = segs.map(s => s.text).join('');
    const n = Math.floor(lerp(0, full.length, prog(t, t0, t1)));
    font(size, opts.weight || 600, opts.fam || F.body);
    g.textAlign = 'left'; g.textBaseline = 'alphabetic';
    let cx = x, used = 0;
    for (const s of segs) {
      const part = s.text.slice(0, Math.max(0, n - used));
      used += s.text.length;
      g.fillStyle = s.color; g.fillText(part, cx, y);
      cx += g.measureText(part).width;
      if (part.length < s.text.length) break;
    }
    const blink = t < t1 + 0.6 ? 1 : (Math.floor((t - t1) * 2.2) % 2 === 0 ? 1 : 0);
    if (blink && t >= t0 - 0.3 && t < (opts.cursorOff || 1e9)) { g.fillStyle = opts.cursor || C.ink; g.fillRect(cx + 4, y - size * 0.82, size * 0.08, size * 1.0); }
    return n;
  }

  // Rubber stamp that slams in from 2.4x.
  const STAMP = {
    too_soon: { fg: C.red, bg: 'rgba(253,228,222,0.92)', label: 'TOO SOON' },
    look: { fg: C.amberText, bg: 'rgba(253,240,204,0.95)', label: 'GIVE IT A LOOK' },
    good: { fg: C.green, bg: 'rgba(220,241,229,0.95)', label: "YOU'RE GOOD" },
    held: { fg: C.green, bg: 'rgba(220,241,229,0.97)', label: 'IN DRAFTS ✓' },
    big: { fg: C.red, bg: 'rgba(253,228,222,0.94)', label: 'TOO SOON?' },
  };
  function stamp(kind, x, y, size, t, t0, rot = -0.07) {
    const p = prog(t, t0, t0 + 0.22);
    if (p <= 0) return;
    const s = lerp(2.4, 1, outCubic(p)) * (p >= 1 ? 1 + 0.04 * Math.exp(-14 * (t - t0 - 0.22)) * Math.sin(40 * (t - t0 - 0.22)) : 1);
    const st = STAMP[kind];
    font(size, 800, F.disp); g.letterSpacing = `${size * 0.06}px`;
    const w = g.measureText(st.label).width + size * 1.0, h = size * 1.55;
    g.letterSpacing = '0px';
    withAlpha(lerp(0, 1, prog(t, t0, t0 + 0.08)), () => at(x, y, s, rot, () => {
      box(-w / 2, -h / 2, w, h, size * 0.28, st.bg, st.fg, Math.max(3, size * 0.12));
      g.lineWidth = Math.max(1.5, size * 0.04); g.strokeStyle = st.fg; rr(-w / 2 + size * 0.22, -h / 2 + size * 0.22, w - size * 0.44, h - size * 0.44, size * 0.18); g.stroke();
      txt(st.label, 0, size * 0.36, size, st.fg, 800, F.disp, 'center', 'alphabetic', size * 0.06);
    }));
  }

  function grain(t) {
    const f = Math.floor(t * 30);
    g.save(); g.globalAlpha = 0.045;
    for (let i = 0; i < 900; i++) {
      const x = hash(i * 3.1 + f * 17.3) * W, y = hash(i * 7.7 + f * 5.9) * H;
      g.fillStyle = hash(i + f) > 0.5 ? '#000' : '#fff';
      g.fillRect(x, y, 2, 2);
    }
    g.restore();
  }

  function cursorArrow(x, y, s = 1, pressed = 0) {
    at(x, y, s * (1 - pressed * 0.12), 0, () => {
      g.beginPath(); g.moveTo(0, 0); g.lineTo(0, 46); g.lineTo(12, 35); g.lineTo(21, 54); g.lineTo(29, 50); g.lineTo(20, 32); g.lineTo(36, 32); g.closePath();
      g.fillStyle = C.ink; g.fill(); g.lineWidth = 3; g.strokeStyle = C.white; g.stroke();
    });
  }

  // Wrapped text; returns lines.
  function wrap(s, maxW, size, weight = 600, fam = F.body) {
    font(size, weight, fam);
    const words = s.split(' '); const lines = []; let line = '';
    for (const w of words) { const test = line ? line + ' ' + w : w; if (g.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test; }
    if (line) lines.push(line);
    return lines;
  }

  // ---------- scene 1: the case (0 – 3.9s) ----------
  function scene1(t) {
    const out = prog(t, 3.55, 3.95);
    const ox = -inExpo(out) * W * 0.6;
    withAlpha(1 - prog(t, 3.75, 3.95), () => at(ox, 0, 1, 0, () => {
      withAlpha(prog(t, 0.1, 0.5), () => mono('Case file · December 7, 2013', 210, 300, 28, C.red));
      const cin = spring(prog(t, 0.05, 1.0) * 1.6);
      const cy = lerp(80, 0, cin);
      withAlpha(prog(t, 0.05, 0.3), () => at(0, cy, 1, 0, () => {
        box(210, 340, 1500, 290, 30, C.card, C.ink, 5, { color: C.ink, dx: 14, dy: 14 });
        // generic avatar (no mascot)
        g.fillStyle = C.paper2; g.beginPath(); g.arc(300, 425, 44, 0, Math.PI * 2); g.fill();
        g.lineWidth = 4; g.strokeStyle = C.ink; g.stroke();
        txt('SO', 300, 440, 34, C.ink2, 800, F.disp, 'center');
        txt('SpaghettiOs', 368, 415, 36, C.ink, 800, F.body);
        txt('@SpaghettiOs · Dec 7, 2013', 368, 459, 26, C.ink3, 500, F.body);
        typeLine([
          { text: 'Take a moment to remember ', color: C.ink },
          { text: '#PearlHarbor', color: C.blue },
          { text: ' with us.', color: C.ink },
        ], 262, 568, 54, t, 0.65, 2.35, { weight: 700, cursorOff: 2.9 });
      }));
      // aftermath tags
      const tags = [['Posted.', 2.6, C.ink], ['Mocked.', 2.85, C.amberText], ['Deleted.', 3.1, C.red]];
      let x = 210;
      tags.forEach(([s, t0, col]) => {
        const p = prog(t, t0, t0 + 0.35);
        const w = width(s, 44, 800, F.disp);
        withAlpha(p, () => at(x + w / 2, 790 + (1 - outBack(p)) * 40, lerp(0.7, 1, outBack(p)), 0, () => txt(s, 0, 0, 72, col, 800, F.disp, 'center')));
        x += w * 1.65 + 40;
      });
    }));
  }

  // ---------- scene 2: the line (4.0 – 6.7s) ----------
  function scene2(t) {
    if (t < 3.85 || t > 6.95) return;
    const inP = prog(t, 3.85, 4.25), out = prog(t, 6.45, 6.85);
    const ox = (1 - outExpo(inP)) * W * 0.5 - inExpo(out) * W * 0.6;
    withAlpha(prog(t, 3.85, 4.05) * (1 - prog(t, 6.65, 6.85)), () => at(ox, 0, 1, 0, () => {
      const l1 = ['Every', 'brand', 'thinks'], l2 = ['it', "won't", 'happen', 'to', 'them.'];
      const draw = (words, y, t0, col, hi) => {
        const size = 128; font(size, 800, F.disp);
        const space = g.measureText(' ').width;
        const total = words.reduce((s, w) => s + g.measureText(w).width, 0) + space * (words.length - 1);
        let x = W / 2 - total / 2;
        words.forEach((w, i) => {
          const p = prog(t, t0 + i * 0.12, t0 + i * 0.12 + 0.4);
          const ww = width(w, size, 800, F.disp);
          withAlpha(p, () => at(x + ww / 2, y + (1 - outBack(p)) * 50, 1, 0, () => txt(w, 0, 0, size, hi && hi.includes(w) ? C.red : col, 800, F.disp, 'center', 'alphabetic', -3)));
          x += ww + space;
        });
      };
      draw(l1, 500, 4.15, C.ink);
      draw(l2, 650, 4.55, C.ink, ["won't"]);
      // red underline under "won't"
      const up = outExpo(prog(t, 5.3, 5.8));
      if (up > 0) {
        const size = 128; font(size, 800, F.disp);
        const space = g.measureText(' ').width;
        const ws = l2.map(w => g.measureText(w).width);
        const total = ws.reduce((a, b) => a + b, 0) + space * (l2.length - 1);
        const x0 = W / 2 - total / 2 + ws[0] + space;
        g.strokeStyle = C.red; g.lineWidth = 12; g.lineCap = 'round';
        g.beginPath(); g.moveTo(x0, 682); g.quadraticCurveTo(x0 + ws[1] / 2, 694, x0 + ws[1] * up, 680); g.stroke();
      }
    }));
  }

  // ---------- shared: queue post card ----------
  function postCard(x, y, w, h, o) {
    box(x, y, w, h, 22, C.white, o.border || C.line, 4, o.shadow ? { color: o.shadow, dx: 10, dy: 10 } : null);
    g.fillStyle = o.avatar || C.paper2; g.beginPath(); g.arc(x + 44, y + 46, 20, 0, Math.PI * 2); g.fill();
    txt(o.channel, x + 76, y + 55, 26, C.ink, 700, F.body);
    if (o.time) txt(o.time, x + 76 + width(o.channel, 26, 700) + 18, y + 55, 24, C.ink3, 500, F.body);
    const lines = wrap(o.text, w - 64, o.size || 32, 600);
    lines.forEach((ln, i) => txt(ln, x + 32, y + 112 + i * (o.size || 32) * 1.3, o.size || 32, o.strike ? C.ink3 : C.ink, 600, F.body));
    if (o.strike) {
      g.strokeStyle = 'rgba(22,20,18,0.35)'; g.lineWidth = 2.5;
      lines.forEach((ln, i) => { const lw = width(ln, o.size || 32, 600); const yy = y + 112 + i * (o.size || 32) * 1.3 - (o.size || 32) * 0.32; g.beginPath(); g.moveTo(x + 32, yy); g.lineTo(x + 32 + lw * o.strike, yy); g.stroke(); });
    }
    return lines.length;
  }

  // ---------- scene 3: the save (6.8 – 10.9s) ----------
  function scene3(t) {
    if (t < 6.6 || t > 11.3) return;
    const inP = prog(t, 6.6, 7.1), out = prog(t, 10.6, 11.0);
    const oy = (1 - outExpo(inP)) * H * 0.4;
    const ox = -inExpo(out) * W * 0.7;
    // micro shake when the stamp lands
    const sh = t > 9.0 && t < 9.35 ? Math.sin(t * 160) * 9 * (1 - prog(t, 9.0, 9.35)) : 0;
    withAlpha(prog(t, 6.6, 6.85) * (1 - prog(t, 10.85, 11.0)), () => at(ox + sh, oy, 1, 0, () => {
      // left text
      withAlpha(prog(t, 6.9, 7.2), () => mono('Too Soon? checks your queue', 140, 300, 26, C.red));
      const lt = (s, y, t0, col) => { const p = prog(t, t0, t0 + 0.5); withAlpha(p, () => txt(s, 140, y + (1 - outExpo(p)) * 30, 70, col, 800, F.disp, 'left', 'alphabetic', -1.5)); };
      lt('Your posts were', 400, 7.05, C.ink);
      lt('written last week.', 480, 7.2, C.ink);
      lt('The news happened', 600, 7.75, C.red);
      lt('this morning.', 680, 7.9, C.red);

      // the card
      const cx = 1000, cy = 300, cw = 780, ch = 300;
      const cp = spring(prog(t, 7.0, 7.9) * 1.6);
      withAlpha(prog(t, 7.0, 7.2), () => at(0, (1 - cp) * 60, 1, 0, () => {
        const flagged = t >= 9.0;
        postCard(cx, cy, cw, ch, { channel: 'lumacoffee', time: 'Today · 4:30 PM', text: 'Our new cold brew is on fire. Grab one before they’re gone this weekend!', size: 34, border: flagged ? C.red : C.line, shadow: flagged ? C.redSoft : null });
        // countdown pill
        const secs = Math.max(3, Math.round(lerp(30, 3, prog(t, 7.4, 8.9))));
        const pillCol = t >= 9.0 ? C.red : secs <= 10 ? C.amberText : C.ink2;
        box(cx + 32, cy + ch - 74, 250, 48, 24, t >= 9.0 ? C.redSoft : C.paper2, null);
        txt(t >= 9.0 ? 'Held before posting' : `Posts in 0:${String(secs).padStart(2, '0')}`, cx + 157, cy + ch - 41, 24, pillCol, 700, F.body, 'center');
        stamp('big', cx + cw - 170, cy - 8, 50, t, 9.0, -0.09);
        withAlpha(prog(t, 9.3, 9.6), () => {
          box(cx, cy + ch + 28, cw, 72, 16, C.redSoft, null);
          txt('⚠  “on fire” echoes today’s news: a warehouse fire downtown', cx + 24, cy + ch + 74, 26, C.ink, 600, F.body);
        });
      }));

      // breaking banner
      const bp = outExpo(prog(t, 8.15, 8.6));
      if (bp > 0) {
        const bx = lerp(-W, 0, bp);
        g.fillStyle = C.red; g.fillRect(bx, 880, W, 110);
        g.fillStyle = C.ink; g.fillRect(bx, 880, 360, 110);
        txt('BREAKING', bx + 180, 952, 50, C.white, 800, F.disp, 'center', 'alphabetic', 3);
        txt('Warehouse fire downtown forces families to evacuate', bx + 400, 952, 46, C.white, 700, F.body);
      }
    }));
  }

  // ---------- scene 4+5: the system and the save (11.0 – 17.8s) ----------
  const ROWS = [
    { tag: 'ALERT', tagBg: C.red, tagFg: C.white, sig: 'Flash Flood Warning: Harbor County', post: 'Throwback to the Harbor County block party!', verdict: 'look', why: 'Under an active alert' },
    { tag: 'DIED', tagBg: C.ink, tagFg: C.paper, sig: 'Singer Jordan Vale has died', post: 'Counting down to Jordan Vale’s album Friday!', verdict: 'too_soon', why: 'Named in tragic news' },
    { tag: 'SENSITIVE DAY', tagBg: C.ink2, tagFg: C.paper, sig: 'Today: the 9/11 anniversary', post: 'Flash sale! 30% off everything today', verdict: 'too_soon', why: 'Promo on a day of remembrance' },
    { tag: 'TRENDING', tagBg: C.blueSoft, tagFg: C.blue, sig: '#Riverside is trending: bridge collapse', post: 'See you at the #Riverside market Saturday!', verdict: 'too_soon', why: 'Hashtag tied to a disaster' },
  ];
  function scene45(t) {
    if (t < 10.75) return;
    const inP = prog(t, 10.75, 11.25);
    const ox = (1 - outExpo(inP)) * W * 0.7;
    withAlpha(prog(t, 10.75, 11.0), () => at(ox, 0, 1, 0, () => {
      // title (cross-fades to "Saved." after the pull)
      const sv = prog(t, 16.65, 16.95);
      withAlpha(1 - prog(t, 16.4, 16.6), () => txt('It reads the room for every post.', 140, 150, 64, C.ink, 800, F.disp, 'left', 'alphabetic', -1.5));
      withAlpha(sv, () => { txt('Saved.', 140, 150, 64, C.green, 800, F.disp, 'left', 'alphabetic', -1.5); txt('Nothing to apologize for.', 140 + width('Saved. ', 64, 800, F.disp), 150, 64, C.ink, 800, F.disp, 'left', 'alphabetic', -1.5); });
      withAlpha(prog(t, 11.2, 11.5), () => { mono("What's happening", 140, 236, 24, C.ink3); mono('Your queue', 1010, 236, 24, C.ink3); });

      ROWS.forEach((r, i) => {
        const y = 270 + i * 170;
        const t0 = 11.35 + i * 0.16;
        // signal card
        const sp = outExpo(prog(t, t0, t0 + 0.5));
        withAlpha(sp * (1 - 0.55 * prog(t, 16.2, 16.6)), () => at(-(1 - sp) * 80, 0, 1, 0, () => {
          box(140, y, 700, 128, 20, C.card, C.ink, 4);
          const tw = monoWidth(r.tag, 20) + 26;
          box(170, y + 24, tw, 36, 8, r.tagBg, null);
          mono(r.tag, 183, y + 49, 20, r.tagFg);
          txt(r.sig, 170, y + 102, 30, C.ink, 700, F.body);
        }));
        // post card
        const pp = outExpo(prog(t, t0 + 0.25, t0 + 0.75));
        const held = t >= 15.9 + i * 0.2 && r.verdict === 'too_soon';
        const isHeldLook = false;
        withAlpha(pp, () => at((1 - pp) * 80, 0, 1, 0, () => {
          const border = held ? C.green : t >= 12.6 + i * 0.32 ? (r.verdict === 'too_soon' ? C.red : r.verdict === 'look' ? C.amber : C.line) : C.line;
          box(1010, y, 770, 128, 20, C.white, border, 4);
          const flip = held ? prog(t, 15.9 + i * 0.2, 16.15 + i * 0.2) : 0;
          txt(r.post, 1040, y + 78, 30, flip ? C.ink3 : C.ink, 600, F.body);
          if (flip) { const lw = width(r.post, 30, 600); g.strokeStyle = 'rgba(22,20,18,0.35)'; g.lineWidth = 2.5; g.beginPath(); g.moveTo(1040, y + 68); g.lineTo(1040 + lw * outCubic(flip), y + 68); g.stroke(); }
          withAlpha(prog(t, 12.8 + i * 0.32, 13.1 + i * 0.32) * (1 - (held ? prog(t, 15.9 + i * 0.2, 16.1 + i * 0.2) : 0)), () => txt(r.why, 1040, y + 112, 22, r.verdict === 'too_soon' ? C.red : C.amberText, 600, F.body));
          withAlpha(held ? prog(t, 16.0 + i * 0.2, 16.3 + i * 0.2) : 0, () => txt('Pulled to drafts. Nothing deleted.', 1040, y + 112, 22, C.green, 600, F.body));
          void isHeldLook;
        }));
        // connector line
        const lp = outCubic(prog(t, 12.1 + i * 0.22, 12.6 + i * 0.22));
        if (lp > 0 && t < 16.6) {
          withAlpha(1 - prog(t, 16.2, 16.6), () => {
            const col = r.verdict === 'too_soon' ? C.red : C.amber;
            g.strokeStyle = col; g.lineWidth = 5; g.setLineDash([12, 10]); g.lineDashOffset = -t * 40;
            g.beginPath(); g.moveTo(840, y + 64); g.lineTo(lerp(840, 1010, lp), y + 64); g.stroke(); g.setLineDash([]);
            g.fillStyle = col; g.beginPath(); g.arc(840, y + 64, 9, 0, Math.PI * 2); g.fill();
          });
        }
        // stamps
        if (!held) stamp(r.verdict, 1655, y + 2, 21, t, 12.6 + i * 0.32, -0.05);
        else stamp('held', 1655, y + 2, 21, t, 15.9 + i * 0.2, -0.05);
      });

      // pull-all button + cursor
      const bp = outBack(prog(t, 14.6, 15.0));
      const pressed = t > 15.65 && t < 15.85 ? 1 : 0;
      withAlpha(prog(t, 14.6, 14.8) * (1 - prog(t, 16.4, 16.7)), () => at(1490, 210, bp * (1 - pressed * 0.06), 0, () => {
        box(-170, -32, 340, 64, 32, C.red, C.red, 3, { color: C.ink, dx: 0, dy: pressed ? 2 : 6 });
        txt('Pull all to drafts', 0, 11, 28, C.white, 700, F.body, 'center');
      }));
      const cp = inOutExpo(prog(t, 14.95, 15.6));
      if (t > 14.9 && t < 16.8) withAlpha(1 - prog(t, 16.4, 16.7), () => cursorArrow(lerp(1760, 1500, cp), lerp(1000, 215, cp), 1.3, pressed));
      // click ripple
      const rp = prog(t, 15.7, 16.2);
      if (rp > 0 && rp < 1) { g.strokeStyle = `rgba(229,67,43,${1 - rp})`; g.lineWidth = 6; g.beginPath(); g.arc(1500, 215, 20 + rp * 90, 0, Math.PI * 2); g.stroke(); }
    }));
  }

  // ---------- scene 6: end card (17.6 – 20s) ----------
  function scene6(t) {
    const wp = inOutExpo(prog(t, 17.5, 18.15));
    if (wp <= 0) return;
    g.save();
    g.beginPath(); g.arc(1500, 215, wp * 2300, 0, Math.PI * 2); g.clip();
    g.fillStyle = C.ink; g.fillRect(0, 0, W, H);
    // logo
    const lp = spring(prog(t, 17.9, 18.8) * 1.6);
    const size = 230;
    const wTs = width('Too Soon', size, 800, F.disp, -8), wQ = width('?', size, 800, F.disp);
    const x0 = W / 2 - (wTs + wQ) / 2;
    withAlpha(prog(t, 17.9, 18.1), () => at(0, (1 - lp) * 80, 1, 0, () => {
      txt('Too Soon', x0, 520, size, C.paper, 800, F.disp, 'left', 'alphabetic', -8);
      // wobbling question mark
      const wob = 0.21 + Math.sin(t * 5) * 0.05 * (1 - prog(t, 19.2, 20)) + (t > 18.6 && t < 19.0 ? Math.sin((t - 18.6) * 30) * 0.25 * (1 - prog(t, 18.6, 19.0)) : 0);
      at(x0 + wTs + wQ / 2, 520, 1, wob, () => txt('?', 0, 0, size, C.red, 800, F.disp, 'center', 'alphabetic'));
    }));
    withAlpha(prog(t, 18.35, 18.7), () => txt('Read the room before you post.', W / 2, 640, 56, C.paper, 700, F.disp, 'center'));
    const up = outBack(prog(t, 18.75, 19.15));
    withAlpha(prog(t, 18.75, 18.95), () => at(W / 2, 760, lerp(0.8, 1, up), 0, () => {
      const url = 'project-too-soon.netlify.app';
      const uw = width(url, 38, 700, F.body) + 80;
      box(-uw / 2, -40, uw, 80, 40, C.red, null);
      txt(url, 0, 13, 38, C.white, 700, F.body, 'center');
    }));
    withAlpha(prog(t, 19.0, 19.35), () => { mono("Built on Buffer's API", W / 2, 900, 26, C.ink3, 'center'); mono('A Nobody Creative thing', W / 2, 945, 22, '#b9b0a3', 'center'); });
    g.restore();
  }

  function renderFrame(T) {
    const t = storyTime(T);
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.fillStyle = C.paper; g.fillRect(0, 0, W, H);
    // faint paper dots
    g.fillStyle = 'rgba(22,20,18,0.035)';
    for (let y = 30; y < H; y += 48) for (let x = 30 + ((y / 48) % 2) * 24; x < W; x += 48) { g.beginPath(); g.arc(x, y, 2, 0, Math.PI * 2); g.fill(); }
    scene1(t); scene2(t); scene3(t); scene45(t); scene6(t);
    grain(T);
  }

  window.DURATION = DUR;
  window.renderFrame = renderFrame;
  window.ready = (async () => {
    await Promise.all([
      `800 100px "${F.disp}"`, `600 100px "${F.disp}"`, `500 100px "${F.body}"`, `600 100px "${F.body}"`, `700 100px "${F.body}"`, `700 100px "${F.mono}"`,
    ].map(f => document.fonts.load(f)));
    await document.fonts.ready;
  })();

  if (!/render/.test(location.search)) {
    window.ready.then(() => {
      const start = performance.now();
      const loop = now => { renderFrame(((now - start) / 1000) % DUR); requestAnimationFrame(loop); };
      requestAnimationFrame(loop);
    });
  } else {
    window.ready.then(() => renderFrame(0));
  }
})();
</script>
</body>
</html>
